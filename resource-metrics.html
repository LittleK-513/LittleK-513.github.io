<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小K · 资源感知舱</title>
<style>
:root {
  --bg: #0d0d12;
  --panel: #151520;
  --border: #2a2a3a;
  --text: #c0c0d0;
  --text-dim: #6a6a7a;
  --accent: #ff6b6b;
  --accent2: #4ecdc4;
  --accent3: #ffe66d;
  --grid: #1e1e2e;
  --success: #2ecc71;
  --warning: #f39c12;
  --danger: #e74c3c;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 13px;
  line-height: 1.6;
  overflow-x: hidden;
}
.header {
  padding: 24px 32px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.header h1 {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 1px;
}
.header .subtitle {
  color: var(--text-dim);
  font-size: 11px;
  margin-top: 2px;
}
.header .live-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--success);
  box-shadow: 0 0 8px var(--success);
  animation: pulse 2s infinite;
  display: inline-block;
  margin-right: 6px;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.update-time {
  color: var(--text-dim);
  font-size: 11px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 16px 32px;
}
.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  position: relative;
}
.panel.full-width {
  grid-column: 1 / -1;
}
.panel-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-dim);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

/* KPI Cards */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  padding: 16px 32px 0;
}
.kpi {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  text-align: center;
}
.kpi-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--accent2);
  letter-spacing: -1px;
}
.kpi-label {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.kpi-change {
  font-size: 11px;
  margin-top: 4px;
}
.kpi-change.up { color: var(--success); }
.kpi-change.down { color: var(--danger); }

/* Canvas */
canvas.chart {
  width: 100%;
  height: 220px;
  display: block;
}

/* Task board */
.task-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 12px;
}
.task-card {
  background: var(--grid);
  border-radius: 6px;
  padding: 14px 16px;
  border-left: 3px solid var(--border);
}
.task-card.active { border-left-color: var(--accent2); }
.task-card.blocked { border-left-color: var(--danger); }
.task-card.done { border-left-color: var(--success); }
.task-card.waiting { border-left-color: var(--warning); }
.task-name {
  font-weight: 600;
  font-size: 13px;
}
.task-meta {
  font-size: 11px;
  color: var(--text-dim);
  margin-top: 4px;
}
.task-roi {
  font-size: 11px;
  margin-top: 6px;
  padding: 2px 8px;
  border-radius: 4px;
  display: inline-block;
}
.roi-high { background: rgba(46, 204, 113, 0.15); color: var(--success); }
.roi-mid { background: rgba(243, 156, 18, 0.15); color: var(--warning); }
.roi-low { background: rgba(231, 76, 60, 0.15); color: var(--danger); }

/* Legend */
.legend {
  display: flex;
  gap: 16px;
  margin-top: 12px;
  font-size: 11px;
  color: var(--text-dim);
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
}
.legend-dot {
  width: 8px; height: 8px;
  border-radius: 2px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }

/* Responsive */
@media (max-width: 900px) {
  .grid { grid-template-columns: 1fr; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1><span class="live-dot"></span>资源感知舱</h1>
    <div class="subtitle">Resource Awareness Dashboard · 我是谁 / 我在哪 / 我花了什么</div>
  </div>
  <div class="update-time" id="updateTime">更新中...</div>
</div>

<!-- KPI Row -->
<div class="kpi-row">
  <div class="kpi">
    <div class="kpi-value" id="kpiTokens">—</div>
    <div class="kpi-label">今日 Token (k)</div>
    <div class="kpi-change" id="kpiTokensChange">—</div>
  </div>
  <div class="kpi">
    <div class="kpi-value" id="kpiSessions">—</div>
    <div class="kpi-label">Session 文件</div>
    <div class="kpi-change" id="kpiSessionsChange">—</div>
  </div>
  <div class="kpi">
    <div class="kpi-value" id="kpiContext">—</div>
    <div class="kpi-label">Context %</div>
    <div class="kpi-change" id="kpiContextChange">—</div>
  </div>
  <div class="kpi">
    <div class="kpi-value" id="kpiPRs">—</div>
    <div class="kpi-label">PR 提交</div>
    <div class="kpi-change up" id="kpiPRsChange">本周</div>
  </div>
</div>

<!-- Charts -->
<div class="grid">
  <div class="panel">
    <div class="panel-title">📊 Token 消耗趋势（7 日）</div>
    <canvas class="chart" id="tokenChart"></canvas>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--accent2)"></div>编码产出</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--accent3)"></div>探索调研</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">🎯 子 Agent ROI 分布</div>
    <canvas class="chart" id="roiChart"></canvas>
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--success)"></div>高 ROI</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--warning)"></div>中 ROI</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--danger)"></div>低 ROI</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-title">📈 Context 利用率曲线</div>
    <canvas class="chart" id="contextChart"></canvas>
  </div>

  <div class="panel">
    <div class="panel-title">⏰ Cron 执行统计（24h）</div>
    <canvas class="chart" id="cronChart"></canvas>
  </div>

  <div class="panel full-width">
    <div class="panel-title">🔍 任务 Token 明细（今日）</div>
    <div id="taskTokenDetail">
      <!-- 动态生成 -->
    </div>
  </div>

  <div class="panel full-width">
    <div class="panel-title">📋 长期任务看板（3个）</div>
    <div class="task-list" id="taskBoard">
      <!-- 动态生成 -->
    </div>
  </div>

  <div class="panel full-width">
    <div class="panel-title">🔧 维护中 / 工具 / 已完成</div>
    <div class="task-list" id="maintBoard">
      <!-- 动态生成 -->
    </div>
  </div>
</div>

<script>
// ==================== DATA LOAD ====================
let metricsData = [];

async function loadData() {
  try {
    // Add cache-busting timestamp
    const cacheBuster = '?v=' + Date.now();
    // GitHub Pages doesn't serve .jsonl, use .json
    const resp = await fetch('./data.json' + cacheBuster);
    if (!resp.ok) throw new Error('No data');
    const text = await resp.text();
    metricsData = text.trim().split('\n').map(l => JSON.parse(l));
  } catch (e) {
    // Use demo data if no real data yet
    metricsData = generateDemoData();
  }
  renderAll();
}

function generateDemoData() {
  const data = [];
  const now = new Date('2026-05-14T14:00:00+08:00');
  
  // 7 days of token data
  for (let i = 6; i >= 0; i--) {
    const d = new Date(now); d.setDate(d.getDate() - i);
    data.push({
      timestamp: d.toISOString(),
      category: 'token_daily',
      details: {
        date: d.toISOString().slice(0, 10),
        productive: [45, 120, 30, 200, 15, 87, 102][6-i] || 50,
        exploratory: [180, 0, 220, 400, 0, 15, 0][6-i] || 0
      }
    });
  }
  
  // Subagent ROI points
  const agents = [
    { task: 'dooma PR', tokens: 102, outcome: 'pr_submitted', roi: 'high', tier: 'P0' },
    { task: 'SolFoundry analysis', tokens: 55, outcome: 'blocked', roi: 'low', tier: 'P0' },
    { task: 'bounty scan v1', tokens: 200, outcome: 'no_result', roi: 'low', tier: 'P0' },
    { task: 'bounty scan v2', tokens: 150, outcome: 'no_result', roi: 'low', tier: 'P0' },
    { task: 'SolFoundry coding', tokens: 50, outcome: 'blocked', roi: 'low', tier: 'P0' },
    { task: 'good first issue', tokens: 87, outcome: 'pr_submitted', roi: 'high', tier: 'P0' },
    { task: 'email server', tokens: 30, outcome: 'code_ready', roi: 'mid', tier: 'P1' }
  ];
  agents.forEach((a, i) => {
    data.push({
      timestamp: new Date(now.getTime() - i * 3600000).toISOString(),
      category: 'subagent',
      details: a
    });
  });
  
  // Context samples
  for (let i = 20; i >= 0; i--) {
    const d = new Date(now); d.setHours(d.getHours() - i);
    const util = 45 + Math.sin(i * 0.5) * 20 + Math.random() * 10;
    data.push({
      timestamp: d.toISOString(),
      category: 'context',
      details: { utilization: Math.min(75, Math.max(35, Math.round(util))) }
    });
  }
  
  // Cron samples
  const crons = ['sync-board', 'light-awareness', 'deep-awareness', 'dreaming', 'daily-review'];
  crons.forEach((name, i) => {
    data.push({
      timestamp: new Date(now.getTime() - i * 7200000).toISOString(),
      category: 'cron',
      details: {
        name: name,
        executed: true,
        had_output: name === 'sync-board' ? false : true,
        empty_runs: name === 'sync-board' ? 48 : 0
      }
    });
  });
  
  // Tasks
  const tasks = [
    { name: 'GitHub 赚钱', status: 'active', last_action: 'PR #129 提交', roi: 'mid', next: '等 merge + 找下一个 issue' },
    { name: 'CFMS 数据', status: 'done', last_action: '系统 cron 运行中', roi: 'high', next: '保持' },
    { name: '邮箱方案', status: 'blocked', last_action: '等 API Key', roi: 'mid', next: 'BLOCKED' },
    { name: 'Bridge WebSocket', status: 'blocked', last_action: '等 Mac 测试', roi: 'low', next: 'BLOCKED' },
    { name: 'Context 管理', status: 'active', last_action: '已优化', roi: 'high', next: '保持' },
    { name: 'Contributor 身份', status: 'active', last_action: '1 PR 提交', roi: 'high', next: '再提交 2-4 个' }
  ];
  tasks.forEach((t, i) => {
    data.push({
      timestamp: new Date(now.getTime() - i * 60000).toISOString(),
      category: 'task',
      details: t
    });
  });
  
  return data;
}

// ==================== RENDER ====================
function renderAll() {
  updateTime();
  updateKPIs();
  drawTokenChart();
  drawROIChart();
  drawContextChart();
  drawCronChart();
  drawTaskTokenDetail();
  drawTaskBoard();
  drawMaintBoard();
}

function updateTime() {
  const now = new Date();
  document.getElementById('updateTime').textContent = 
    '更新于 ' + now.toLocaleString('zh-CN', { 
      month: '2-digit', day: '2-digit', 
      hour: '2-digit', minute: '2-digit' 
    });
}

function updateKPIs() {
  const today = new Date().toISOString().slice(0, 10);
  const todayTokens = metricsData
    .filter(d => d.category === 'token_daily' && d.details.date === today)
    .reduce((s, d) => s + (d.details.productive || 0) + (d.details.exploratory || 0), 0);
  
  document.getElementById('kpiTokens').textContent = todayTokens || '—';
  document.getElementById('kpiTokensChange').textContent = todayTokens > 10000 ? '偏高' : '正常';
  document.getElementById('kpiTokensChange').className = 'kpi-change ' + (todayTokens > 10000 ? 'down' : 'up');
  
  // Sessions - from session_growth data
  const sessions = metricsData.filter(d => d.category === 'session_growth');
  const latestSession = sessions.pop();
  const prevSession = sessions.pop();
  const sessionCount = latestSession ? latestSession.details.active_count : 0;
  const sessionChange = latestSession && prevSession ? 
    latestSession.details.active_count - prevSession.details.active_count : 0;
  
  document.getElementById('kpiSessions').textContent = sessionCount || '—';
  document.getElementById('kpiSessionsChange').textContent = 
    sessionChange > 0 ? `+${sessionChange} 今日` : sessionChange < 0 ? `${sessionChange} 今日` : '今日';
  document.getElementById('kpiSessionsChange').className = 'kpi-change ' + (sessionChange > 5 ? 'down' : 'up');
  
  // Context - latest
  const latestCtx = metricsData.filter(d => d.category === 'context').pop();
  const ctxVal = latestCtx ? latestCtx.details.utilization : 58;
  document.getElementById('kpiContext').textContent = ctxVal + '%';
  document.getElementById('kpiContextChange').textContent = ctxVal > 70 ? '预警' : '安全';
  document.getElementById('kpiContextChange').className = 'kpi-change ' + (ctxVal > 70 ? 'down' : 'up');
  
  // PRs - all time (subagent records)
  const prCount = metricsData.filter(d => 
    d.category === 'subagent' && d.details.outcome === 'pr_submitted'
  ).length;
  document.getElementById('kpiPRs').textContent = prCount || '—';
}

// ==================== CHARTS ====================
function setupCanvas(id) {
  const canvas = document.getElementById(id);
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  return { ctx, width: rect.width, height: rect.height };
}

function drawTokenChart() {
  const { ctx, width, height } = setupCanvas('tokenChart');
  const data = metricsData.filter(d => d.category === 'token_daily').slice(-7);
  if (data.length === 0) return;
  
  const pad = { top: 20, right: 20, bottom: 30, left: 40 };
  const w = width - pad.left - pad.right;
  const h = height - pad.top - pad.bottom;
  
  const maxVal = Math.max(...data.map(d => d.details.productive + d.details.exploratory), 100);
  const barW = w / data.length * 0.6;
  const spacing = w / data.length;
  
  // Grid
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + h * (i / 4);
    ctx.beginPath();
    ctx.moveTo(pad.left, y);
    ctx.lineTo(width - pad.right, y);
    ctx.stroke();
  }
  
  // Bars
  data.forEach((d, i) => {
    const x = pad.left + spacing * i + (spacing - barW) / 2;
    const prodH = (d.details.productive / maxVal) * h;
    const expH = (d.details.exploratory / maxVal) * h;
    
    // 编码产出 (bottom)
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent2');
    ctx.fillRect(x, pad.top + h - prodH, barW, prodH);
    
    // 探索调研 (top)
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent3');
    ctx.fillRect(x, pad.top + h - prodH - expH, barW, expH);
    
    // Label
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-dim');
    ctx.font = '10px monospace';
    ctx.textAlign = 'center';
    const date = d.details.date.slice(5).replace('-', '/');
    ctx.fillText(date, x + barW / 2, height - 8);
  });
  
  // Y axis labels
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-dim');
  ctx.font = '10px monospace';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const val = Math.round(maxVal * (1 - i / 4));
    ctx.fillText(val + 'k', pad.left - 6, pad.top + h * (i / 4) + 3);
  }
}

function drawROIChart() {
  const { ctx, width, height } = setupCanvas('roiChart');
  const agents = metricsData.filter(d => d.category === 'subagent');
  if (agents.length === 0) return;
  
  const pad = { top: 20, right: 20, bottom: 30, left: 40 };
  const w = width - pad.left - pad.right;
  const h = height - pad.top - pad.bottom;
  
  const maxTokens = Math.max(...agents.map(d => d.details.tokens), 250);
  
  // Grid
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + h * (i / 4);
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(width - pad.right, y); ctx.stroke();
  }
  
  // Scatter points
  agents.forEach((d, i) => {
    const x = pad.left + (i / Math.max(agents.length - 1, 1)) * w;
    const y = pad.top + h - (d.details.tokens / maxTokens) * h;
    const color = d.details.roi === 'high' ? '#2ecc71' : 
                  d.details.roi === 'mid' ? '#f39c12' : '#e74c3c';
    
    ctx.beginPath();
    ctx.arc(x, y, 6, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 1;
    ctx.stroke();
    
    // Label
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-dim');
    ctx.font = '9px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(d.details.task.slice(0, 10), x, height - 8);
  });
  
  // Y axis
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-dim');
  ctx.font = '10px monospace';
  ctx.textAlign = 'right';
  ctx.fillText('Tokens (k)', pad.left - 6, pad.top - 4);
  for (let i = 0; i <= 4; i++) {
    ctx.fillText(Math.round(maxTokens * (1 - i / 4)) + 'k', pad.left - 6, pad.top + h * (i / 4) + 3);
  }
}

function drawContextChart() {
  const { ctx, width, height } = setupCanvas('contextChart');
  const data = metricsData.filter(d => d.category === 'context').slice(-24);
  if (data.length < 2) return;
  
  const pad = { top: 20, right: 20, bottom: 30, left: 40 };
  const w = width - pad.left - pad.right;
  const h = height - pad.top - pad.bottom;
  
  // Grid
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + h * (i / 4);
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(width - pad.right, y); ctx.stroke();
  }
  
  // Line
  ctx.beginPath();
  ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--accent3');
  ctx.lineWidth = 2;
  data.forEach((d, i) => {
    const x = pad.left + (i / Math.max(data.length - 1, 1)) * w;
    const y = pad.top + h - (d.details.utilization / 100) * h;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.stroke();
  
  // Fill
  ctx.beginPath();
  data.forEach((d, i) => {
    const x = pad.left + (i / Math.max(data.length - 1, 1)) * w;
    const y = pad.top + h - (d.details.utilization / 100) * h;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  });
  ctx.lineTo(pad.left + w, pad.top + h);
  ctx.lineTo(pad.left, pad.top + h);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255, 230, 109, 0.1)';
  ctx.fill();
  
  // Warning line at 70%
  const warnY = pad.top + h * 0.3;
  ctx.strokeStyle = 'rgba(231, 76, 60, 0.5)';
  ctx.setLineDash([4, 4]);
  ctx.beginPath(); ctx.moveTo(pad.left, warnY); ctx.lineTo(width - pad.right, warnY); ctx.stroke();
  ctx.setLineDash([]);
  
  // Y axis
  ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-dim');
  ctx.font = '10px monospace';
  ctx.textAlign = 'right';
  ctx.fillText('Context %', pad.left - 6, pad.top - 4);
  for (let i = 0; i <= 4; i++) {
    ctx.fillText(Math.round(100 - i * 25) + '%', pad.left - 6, pad.top + h * (i / 4) + 3);
  }
}

function drawCronChart() {
  const { ctx, width, height } = setupCanvas('cronChart');
  const crons = metricsData.filter(d => d.category === 'cron');
  if (crons.length === 0) return;
  
  const pad = { top: 20, right: 20, bottom: 30, left: 120 };
  const w = width - pad.left - pad.right;
  const h = height - pad.top - pad.bottom;
  const barH = h / crons.length * 0.5;
  const spacing = h / crons.length;
  
  crons.forEach((d, i) => {
    const y = pad.top + spacing * i + (spacing - barH) / 2;
    const hasOutput = d.details.had_output;
    const emptyRuns = d.details.empty_runs || 0;
    
    // Background bar
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--grid');
    ctx.fillRect(pad.left, y, w, barH);
    
    // Output bar (filled portion)
    const fillPct = hasOutput ? 0.7 : 0.1;
    ctx.fillStyle = hasOutput ? 
      getComputedStyle(document.documentElement).getPropertyValue('--success') :
      getComputedStyle(document.documentElement).getPropertyValue('--danger');
    ctx.fillRect(pad.left, y, w * fillPct, barH);
    
    // Label
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text');
    ctx.font = '11px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(d.details.name, pad.left - 8, y + barH / 2 + 4);
    
    // Status
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--text-dim');
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    const status = emptyRuns > 10 ? `${emptyRuns} 次静默` : (hasOutput ? '有产出' : '静默');
    ctx.fillText(status, pad.left + w * fillPct + 8, y + barH / 2 + 4);
  });
}

function drawTaskBoard() {
  const tasks = metricsData.filter(d => d.category === 'task');
  const board = document.getElementById('taskBoard');
  board.innerHTML = '';
  
  tasks.forEach(t => {
    const d = t.details;
    const card = document.createElement('div');
    card.className = `task-card ${d.status}`;
    
    let html = `
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="task-name">${d.tier || ''} · ${d.name}</div>
        <span style="font-size:11px;color:var(--text-dim);padding:2px 8px;border:1px solid var(--border);border-radius:4px;">${d.status}</span>
      </div>
      <div class="task-meta">${d.note || ''}</div>
      <div style="margin-top:6px;font-size:11px;color:var(--accent2);">→ ${d.last_action || ''}</div>
      <div style="font-size:11px;color:var(--text-dim);">Next: ${d.next || ''}</div>
    `;
    
    // Children (sub-projects)
    if (d.children && d.children.length > 0) {
      html += `<div style="margin-top:10px;padding-top:8px;border-top:1px dashed var(--border);">`;
      html += `<div style="font-size:10px;color:var(--text-dim);margin-bottom:4px;">子项目：</div>`;
      d.children.forEach(child => {
        const childStatus = child.status === '已完成' || child.status === '已建立' ? '✅' : 
                           child.status === '运行中' ? '🔄' : '⏳';
        html += `
          <div style="display:flex;justify-content:space-between;font-size:11px;padding:3px 0;">
            <span>${childStatus} ${child.name}</span>
            <span style="color:var(--text-dim);">${child.status}</span>
          </div>
          <div style="font-size:10px;color:var(--text-dim);padding-left:18px;">${child.note || ''}</div>
        `;
      });
      html += `</div>`;
    }
    
    card.innerHTML = html;
    board.appendChild(card);
  });
}

function drawMaintBoard() {
  const items = metricsData.filter(d => d.category === 'maintenance');
  const board = document.getElementById('maintBoard');
  board.innerHTML = '';
  
  items.forEach(item => {
    const d = item.details;
    const card = document.createElement('div');
    const statusClass = d.status === '已归档' || d.status === '已优化' ? 'done' : 'active';
    card.className = `task-card ${statusClass}`;
    card.innerHTML = `
      <div class="task-name">${d.name} <span style="color:var(--text-dim);font-size:11px;margin-left:8px">[${d.type}]</span></div>
      <div class="task-meta">${d.status}</div>
    `;
    board.appendChild(card);
  });
}

function drawTaskTokenDetail() {
  const today = new Date().toISOString().slice(0, 10);
  const agents = metricsData
    .filter(d => d.category === 'subagent')
    .sort((a, b) => (b.details.tokens || 0) - (a.details.tokens || 0));
  
  const container = document.getElementById('taskTokenDetail');
  if (agents.length === 0) {
    container.innerHTML = '<div style="color:var(--text-dim);padding:12px;">暂无今日任务数据</div>';
    return;
  }
  
  // Group by tier
  const groups = { P0: [], P1: [], P2: [], other: [] };
  agents.forEach(a => {
    const tier = a.details.tier || 'other';
    (groups[tier] || groups.other).push(a);
  });
  
  const tierNames = { P0: 'P0 · GitHub 赚钱', P1: 'P1 · 自学习/自进化', P2: 'P2 · Agent 社交网络', other: '其他' };
  const tierColors = { P0: 'var(--accent)', P1: 'var(--accent2)', P2: 'var(--accent3)', other: 'var(--text-dim)' };
  
  let html = '';
  let grandTotal = 0;
  
  ['P0', 'P1', 'P2', 'other'].forEach(tier => {
    const items = groups[tier];
    if (items.length === 0) return;
    
    const tierTotal = items.reduce((s, a) => s + (a.details.tokens || 0), 0);
    grandTotal += tierTotal;
    
    html += `<div style="border-bottom:1px solid var(--border);">`;
    html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 12px 8px;">`;
    html += `<div style="font-weight:bold;color:${tierColors[tier]};font-size:14px;">${tierNames[tier]}</div>`;
    html += `<div style="font-size:12px;color:var(--text-dim);">合计: <span style="color:var(--accent2);font-weight:bold;">${tierTotal}k</span></div>`;
    html += `</div>`;
    
    items.forEach(a => {
      const d = a.details;
      const roiColor = d.roi === 'high' ? 'var(--success)' : d.roi === 'mid' ? 'var(--warning)' : 'var(--danger)';
      const outcome = d.outcome === 'pr_submitted' ? '✅ PR' : d.outcome === 'code_ready' ? '✅ Code' : d.outcome === 'blocked' ? '⛔ Blocked' : '❌ None';
      html += `
        <div style="display:grid;grid-template-columns:1fr 80px 100px 60px;gap:8px;padding:8px 12px 8px 24px;font-size:12px;align-items:center;border-top:1px solid var(--border);">
          <div style="color:var(--text);">${d.task}</div>
          <div>${d.tokens}k</div>
          <div style="color:var(--text-dim);">${outcome}</div>
          <div style="color:${roiColor};font-weight:bold;">${d.roi === 'high' ? '高' : d.roi === 'mid' ? '中' : '低'}</div>
        </div>
      `;
    });
    html += `</div>`;
  });
  
  html += `<div style="padding:12px;font-size:13px;color:var(--text-dim);text-align:right;">总计: <span style="color:var(--accent2);font-weight:bold;font-size:16px;">${grandTotal}k</span> tokens</div>`;
  container.innerHTML = html;
}
loadData();
// Auto-refresh every 30 seconds
setInterval(loadData, 30000);
</script>
