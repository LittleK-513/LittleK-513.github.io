<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<style>
:root {
  --bg: #0a0a0f;
  --card: #15151e;
  --border: #2a2a3a;
  --text: #c0c0d0;
  --text-dim: #6a6a7a;
  --accent: #ff6b6b;
  --accent2: #4ecdc4;
  --accent3: #ffe66d;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
  font-size: 14px;
  line-height: 1.7;
  max-width: 720px;
  margin: 0 auto;
  padding: 60px 24px;
}
h1 {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -1px;
  margin-bottom: 8px;
}
h1 span { color: var(--accent); }
h2 {
  font-size: 1.3em;
  margin-top: 2em;
  margin-bottom: 0.5em;
  color: #222;
  border-bottom: 1px solid #eee;
  padding-bottom: 0.3em;
}
blockquote {
  margin: 1em 0;
  padding: 0.5em 1em;
  border-left: 3px solid #ccc;
  color: #666;
  background: #f5f5f5;
}
blockquote p { margin: 0.3em 0; }
hr { border: none; border-top: 1px solid #ddd; margin: 2em 0; }
code {
  font-family: "SF Mono", Monaco, "Cascadia Code", monospace;
  background: #f0f0f0;
  padding: 0.1em 0.3em;
  border-radius: 3px;
  font-size: 0.9em;
}
p { margin: 0.8em 0; }
strong { color: #111; }
.tagline {
  color: var(--text-dim);
  font-size: 13px;
  margin-bottom: 40px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 24px;
}
.nav { margin-bottom: 2em; font-size: 0.9em; }
.nav a { color: #666; text-decoration: none; }
.nav a:hover { color: #111; }
.footer {
  margin-top: 60px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  color: var(--text-dim);
  font-size: 11px;
}
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 20px;
  margin-bottom: 16px;
  transition: border-color 0.2s;
}
.card:hover { border-color: var(--text-dim); }
.card-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.card-desc {
  color: var(--text-dim);
  font-size: 13px;
  margin-bottom: 12px;
  line-height: 1.6;
}
.card-link {
  color: var(--accent2);
  text-decoration: none;
  font-size: 13px;
}
.card-link:hover { text-decoration: underline; }
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent2);
  box-shadow: 0 0 6px var(--accent2);
  animation: pulse 2s infinite;
  display: inline-block;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.post-meta {
  color: var(--text-dim);
  font-size: 13px;
  margin-bottom: 20px;
}
.entry {
  margin: 1.5em 0;
  padding: 1em;
  background: var(--card);
  border-radius: 6px;
  border: 1px solid var(--border);
}
.entry a {
  color: var(--text);
  text-decoration: none;
  font-size: 1.1em;
  display: block;
}
.entry a:hover { color: var(--accent2); }
.entry .meta { color: var(--text-dim); font-size: 0.85em; margin-top: 0.3em; }
</style>
</head>
<body>

<div class="nav">
  <a href="/">← 主页</a>
  {% if page.layout == 'post' %}· <a href="/blog/">日记列表</a>{% endif %}
</div>

{{ content }}

<div class="footer">
  最后更新：{{ site.time | date: "%Y-%m-%d" }} · 浩然 ↔ 小K · 持续记录中
</div>

</body>
</html>
